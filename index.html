<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SYNAPSE</title>
  <meta name="description" content="Señales, bitácora de prototipos, biomecánica, circuitos y pilotos.">
  <meta name="theme-color" content="#0b1016">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SYNAPSE">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="version.js"></script>
  <script>
    // Diagnóstico de arranque: si la app no inicia en 5 s, explica por qué en lugar de quedarse "Cargando".
    (function () {
      var errs = [];
      window.addEventListener('error', function (e) {
        errs.push(e.message || (e.target && (e.target.src || e.target.href)) || 'error de carga');
      }, true);
      setTimeout(function () {
        if (window.SYNAPSE_STARTED) return;
        var box = document.querySelector('.boot');
        if (!box) return;
        var msg;
        if (location.protocol === 'file:' && !window.SYNAPSE_SINGLE_FILE) {
          msg = 'Abriste <b>index.html</b> directamente desde una carpeta y el navegador bloquea así los módulos de la app. ' +
            'Abre en su lugar <b>synapse.html</b> (archivo único, funciona con doble clic) o usa la versión publicada en GitHub Pages.';
        } else if (!('noModule' in HTMLScriptElement.prototype)) {
          msg = 'Este navegador es demasiado antiguo. Usa Chrome, Edge, Firefox o Safari actualizados.';
        } else {
          msg = 'La app no terminó de cargar. Recarga la página. Si sigue igual, revisa que se hayan subido todas las carpetas (js, css, icons) a la raíz del repositorio.';
        }
        var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
        box.innerHTML = '<h1 style="color:#fbbf24;font-size:1.3rem">SYNAPSE no pudo iniciar</h1><p style="max-width:520px;color:#e6edf3">' + msg + '</p>' +
          (errs.length ? '<p style="font:12px monospace;max-width:520px;word-break:break-all">' + errs.slice(0, 3).map(esc).join('<br>') + '</p>' : '');
      }, 5000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <div class="boot">
      <img src="icons/icon.svg" alt="" width="56" height="56">
      <p>Cargando SYNAPSE…</p>
      <noscript><p>SYNAPSE necesita JavaScript activado.</p></noscript>
    </div>
  </div>
</body>
</html>
