  <style>
/* SYNAPSE: tema oscuro de laboratorio, sin dependencias. */
:root {
  --bg: #0b1016;
  --bg-2: #111821;
  --panel: #151e29;
  --panel-2: #1b2633;
  --line: #263445;
  --line-2: #33465c;
  --text: #e6edf3;
  --muted: #8b9bb0;
  --accent: #3ee6c4;
  --accent-ink: #04201a;
  --accent-soft: rgba(62, 230, 196, 0.12);
  --left: #5aa9ff;   /* lado izquierdo en gráficas */
  --right: #ff8a5c;  /* lado derecho en gráficas */
  --ok: #4ade80;
  --warn: #fbbf24;
  --danger: #f87171;
  --radius: 10px;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --top-h: 56px;
  --tab-h: 62px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.05rem; letter-spacing: .01em; }
p { margin: 0 0 .75em; }
ul, ol { margin: 0 0 .75em; padding-left: 1.3em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.center { text-align: center; }
.ok-text { color: var(--ok); }
.warn-text { color: var(--warn); }
.ico { display: block; flex: none; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Arranque / error ---------- */
.boot, .fatal { min-height: 100dvh; display: grid; place-content: center; text-align: center; gap: 8px; padding: 24px; color: var(--muted); }
.boot img { margin: 0 auto; animation: pulse 1.4s ease-in-out infinite; }
.fatal h1 { color: var(--danger); }
@keyframes pulse { 50% { opacity: .45; transform: scale(.94); } }

/* ---------- Estructura ---------- */
#app {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto 1fr;
  grid-template-areas: "top" "main";
  min-height: 100dvh;
}
.topbar {
  grid-area: top;
  position: sticky; top: 0; z-index: 20;
  display: grid;
  grid-template-columns: auto 1fr auto;
  grid-template-areas: "brand . data" "ctx ctx ctx";
  align-items: center;
  gap: 8px 12px;
  padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
  background: rgba(11, 16, 22, .92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { grid-area: brand; display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 700; letter-spacing: .14em; font-size: .95rem; }
.top-data { grid-area: data; }
.ctxbar { grid-area: ctx; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ctx-item { display: flex; flex-direction: column; min-width: 0; }
.ctx-k { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-left: 2px; }
.ctx-select {
  width: 100%; min-width: 0;
  background: var(--panel); color: var(--muted);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 8px; font: inherit; font-size: .85rem;
  text-overflow: ellipsis;
}
.ctx-select.set { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

#view {
  grid-area: main;
  width: 100%; max-width: 1100px; margin: 0 auto;
  padding: 16px max(14px, env(safe-area-inset-right)) calc(var(--tab-h) + 24px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
  outline: none;
}
.sidenav { display: none; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(6, 1fr);
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(17, 24, 33, .96);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
}
.tab-link { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: .68rem; }
.tab-link.active { color: var(--accent); }

@media (min-width: 900px) {
  :root { --top-h: 69px; }
  #app {
    grid-template-columns: 220px 1fr;
    grid-template-areas: "top top" "side main";
  }
  .topbar { grid-template-columns: auto 1fr auto; grid-template-areas: "brand ctx data"; padding-top: calc(10px + env(safe-area-inset-top)); padding-bottom: 10px; }
  .ctxbar { max-width: 720px; justify-self: center; width: 100%; }
  .top-data { display: none; }
  .sidenav {
    grid-area: side;
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: var(--top-h); height: calc(100dvh - var(--top-h));
    padding: 14px 10px; border-right: 1px solid var(--line); background: var(--bg-2);
  }
  .side-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; }
  .side-link:hover { background: var(--panel); color: var(--text); }
  .side-link.active { background: var(--accent-soft); color: var(--accent); }
  .side-spacer { flex: 1; }
  .tabbar { display: none; }
  #view { padding: 24px 28px 48px; }
}

/* ---------- Componentes ---------- */
.page-head h1 { display: flex; align-items: center; gap: 10px; }
.page-head h1 span { color: var(--accent); }
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px;
}
.card > :last-child { margin-bottom: 0; }
.card.hero { border-color: var(--accent); background: linear-gradient(135deg, var(--accent-soft), transparent 60%), var(--panel); }
.card.danger-zone { border-color: rgba(248, 113, 113, .35); }
.card.placeholder .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: .8rem; font-weight: 600; }
.feature-list li { margin-bottom: 4px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 14px;
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--line-2); border-radius: 8px;
  font: inherit; font-weight: 600; font-size: .9rem; text-decoration: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { background: transparent; color: var(--danger); border-color: rgba(248, 113, 113, .6); }
.btn.danger:hover:not(:disabled) { background: rgba(248, 113, 113, .12); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: .82rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: .75em; }
.icon-btn {
  display: inline-grid; place-items: center; width: 38px; height: 38px;
  background: transparent; color: var(--muted); border: 1px solid transparent; border-radius: 8px; cursor: pointer;
}
.icon-btn:hover { color: var(--text); background: var(--panel-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.input {
  min-height: 40px; padding: 8px 10px; width: 100%;
  background: var(--bg-2); color: var(--text);
  border: 1px solid var(--line-2); border-radius: 8px; font: inherit;
}
.input.invalid { border-color: var(--danger); }
input[type="number"].input { font-family: var(--mono); }
.check { display: flex; align-items: center; gap: 8px; margin-bottom: .75em; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 14px; }
.banner > span:nth-child(2) { flex: 1; }
.banner.warn { background: rgba(251, 191, 36, .1); border: 1px solid rgba(251, 191, 36, .4); color: #fde68a; }
.note { padding: 8px 12px; border-radius: 8px; font-size: .9rem; }
.note.warn { background: rgba(251, 191, 36, .1); color: #fde68a; }

.ctx-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: .75em; }
.ctx-tile { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); }
.ctx-tile.empty { border-left-color: var(--line-2); }
.ctx-tile.empty strong { color: var(--muted); font-weight: 500; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: .75em; }
.stat { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; padding: 12px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); color: var(--text); text-decoration: none; }
.stat > span:first-child { grid-row: span 2; color: var(--accent); }
.stat strong { font: 700 1.35rem var(--mono); }
.stat span:last-child { color: var(--muted); font-size: .8rem; }
.stat:hover { border-color: var(--line-2); }

.conv-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; align-items: center; }
.conv-row select:first-child { grid-column: 1 / -1; }
.conv-row .icon-btn { justify-self: center; }
@media (min-width: 640px) { .conv-row { grid-template-columns: 1.4fr 1fr 1fr auto 1fr; } .conv-row select:first-child { grid-column: auto; } }
@media (max-width: 639px) { .conv-row input { grid-column: 1 / -1; } }
.conv-out { display: block; font: 700 1.5rem var(--mono); color: var(--accent); margin-bottom: 8px; word-break: break-all; }
.conv-all { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 9px; border-radius: 99px; background: var(--bg-2); border: 1px solid var(--line); font: .8rem var(--mono); color: var(--muted); }

.meter { height: 8px; border-radius: 99px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; margin-bottom: .75em; }
.meter span { display: block; height: 100%; background: var(--accent); }

.stages { list-style: none; padding: 0; display: grid; gap: 6px; }
.stages li { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.stages li.done { color: var(--text); }
.stage-n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-2); font: 600 .8rem var(--mono); flex: none; }
.stages li.done .stage-n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* ---------- Diálogos y avisos ---------- */
.modal {
  width: min(520px, calc(100vw - 24px)); max-height: calc(100dvh - 40px);
  padding: 0; border: 1px solid var(--line-2); border-radius: 14px;
  background: var(--panel); color: var(--text);
}
.modal.wide { width: min(860px, calc(100vw - 24px)); }
.modal::backdrop { background: rgba(0, 0, 0, .6); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
.modal-head h2 { margin: 0; }
.modal-body { padding: 6px 16px 10px; overflow: auto; }
.modal-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 16px 16px; }

#toasts {
  position: fixed; z-index: 100; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px; width: min(480px, calc(100vw - 24px));
}
@media (min-width: 900px) { #toasts { bottom: 20px; } }
